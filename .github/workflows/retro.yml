name: Retro USB experimental
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: retro-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    container: devkitpro/devkitppc@sha256:44cb1a920e1ec3ec7c06767493c3b85f8d643d6137cc4661f0201895ac6e4967
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Prepare host tools
        run: apt-get update -qq && apt-get install -y -qq cmake ninja-build zlib1g-dev zstd python3-pip gh && python3 -m pip install --break-system-packages py7zr==1.0.0
      - name: Validate experimental version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat retro-integration/VERSION)"
          [[ "$version" =~ ^v0\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]] || { echo 'Only experimental alpha releases are enabled'; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "${GITHUB_REF#refs/tags/}" = "$version"; fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Compile and test host logic
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-host -G Ninja
          cmake --build build-host -j4
          ctest --test-dir build-host -j4 --output-on-failure
          python3 -m unittest discover -s tests -p '*_test.py' -v
          python3 tools/lang_source.py
          git diff --exit-code -- wii/lang
      - name: Compile Wii and channel; verify matching plugins
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git rev-list --count HEAD)"
          commit="$(git rev-parse --short=8 HEAD)"
          stamp="2610-${revision}-alpha-g${commit}"
          make -f Makefile.wii -j4 RIFTWII_COMMITS="$revision" RIFTWII_VERSION="2610-${revision}-alpha" RIFTWII_COMMIT="$commit" RIFTWII_BUILD_STAMP="$stamp"
          make -f Makefile.channel -j4
          python3 tools/make_plugin.py check --dol build_wii/riftwii-unpacked.dol build-plugins/plugins/*.rwp
      - name: Package verified emulator combination, sources and update manifest
        run: python3 retro-integration/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: Retro-USB-${{ env.RELEASE_VERSION }}
          path: dist/*
          if-no-files-found: error
      - name: Publish new experimental release without overwriting an existing release
        if: success() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: danipaises/RiftWii-retro-USB-Only
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            echo 'Release already exists: preserving all existing assets. Increment retro-integration/VERSION for a new release.'
            exit 0
          fi
          gh release create "$RELEASE_VERSION" --target "$GITHUB_SHA" dist/* --prerelease --title "RiftWii Retro USB-Only $RELEASE_VERSION (experimental)" --notes-file retro-integration/STATUS.md
